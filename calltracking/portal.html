<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>飲食店コールトラッキングポータル</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <div class="container">
      <h1>飲食店コールトラッキングポータル</h1>
      <nav>
        <ul class="nav">
          <li><a href="#home">店舗一覧</a></li>
          <li><a href="#reports">レポート</a></li>
          <li><a href="#settings">設定</a></li>
        </ul>
      </nav>
    </div>
  </header>
  <main class="main">
    <section id="home" class="section">
      <h2>店舗一覧</h2>
      <ul class="store-list">
        <li>
          <a href="store1.html">
            <img src="images/store1.jpg" alt="レストラン1の画像">
            レストラン1
          </a>
        </li>
        <li>
          <a href="store2.html">
            <img src="images/store2.jpg" alt="レストラン2の画像">
            レストラン2
          </a>
        </li>
        <li>
          <a href="store3.html">
            <img src="images/store3.jpg" alt="レストラン3の画像">
            レストラン3
          </a>
        </li>
      </ul>
    </section>
    <section id="reports" class="section">
      <h2>レポート</h2>
      <p>詳細なコール履歴と分析データを表示します。</p>
    </section>
    <section id="settings" class="section">
      <h2>設定</h2>
      <p>通知やトラッキングの設定を変更できます。</p>
    </section>
    <section id="search" class="section">
      <h2>検索</h2>
      <form action="#" method="get" class="search-form">
        <label for="area">エリア:</label>
        <select id="area" name="area">
          <option value="">選択してください</option>
          <option value="tokyo">東京</option>
          <option value="osaka">大阪</option>
          <option value="kyoto">京都</option>
        </select>

        <label for="genre">ジャンル:</label>
        <select id="genre" name="genre">
          <option value="">選択してください</option>
          <option value="japanese">和食</option>
          <option value="italian">イタリアン</option>
          <option value="chinese">中華</option>
        </select>

        <button type="submit">検索</button>
      </form>
    </section>
    <section id="promotions" class="section">
      <h2>プロモーション</h2>
      <div class="promotion-list">
        <article class="promotion-item">
          <h3>楽天ポイント2倍キャンペーン</h3>
          <p>今だけ、対象店舗で楽天ポイントが2倍貯まります！</p>
        </article>
        <article class="promotion-item">
          <h3>新規登録特典</h3>
          <p>新規登録で500ポイントプレゼント！</p>
        </article>
      </div>
    </section>
  </main>
  <footer class="footer">
    <div class="container">
      <p>&copy; 2025 飲食店コールトラッキング. All rights reserved.</p>
    </div>
  </footer>
  <script src="app.js"></script>
</body>
</html>
