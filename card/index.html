<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>JCBカードポータル</title>
  <style>
    :root{
      --line-green:#06c755;
      --line-green-d:#05b24d;
      --ink:#222;
      --muted:#6b7280;
      --border:#e6e7e9;
      --bg:#f5f6f7;
      --chip:#eef0f3;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial; color:var(--ink); background:var(--bg);
    }
    .wrap{display:grid; grid-template-columns: 1fr; gap:16px; padding:16px; min-height:100vh}
    @media(min-width:1024px){.wrap{grid-template-columns: 2fr 3fr}}
    .card{background:#fff; border:1px solid var(--border); border-radius:16px; box-shadow:0 1px 2px rgba(0,0,0,.04)}
    .card-h{padding:12px 16px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--border)}
    .card-c{padding:16px}
    .row{display:grid; grid-template-columns:1fr 1fr; gap:12px}
    label{font-size:12px; color:#555; display:block; margin-bottom:4px}
    input[type="text"], .switch{
      width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:10px; font-size:14px; background:#fff
    }
    .btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:10px 14px; border-radius:999px; border:1px solid var(--border); background:#fff; cursor:pointer; font-weight:600}
    .btn.prim{background:var(--line-green); color:#fff; border-color:var(--line-green)}
    .btn.prim:hover{background:var(--line-green-d)}
    .btn.outl{background:#fff}
    .muted{color:var(--muted)}
    .badge{display:inline-flex; gap:6px; align-items:center; font-size:12px; padding:6px 10px; border-radius:999px; border:1px solid var(--border); background:#fff}

    /* Header */
    .header{background:#fff; padding:16px 0; box-shadow:0 2px 4px rgba(0,0,0,.1)}
    .header h1{font-size:24px; margin:0; text-align:center}
    .nav{display:flex; justify-content:center; gap:16px; margin-top:8px}
    .nav a{font-size:14px; color:var(--ink); text-decoration:none}
    .nav a:hover{text-decoration:underline}

    /* Main content */
    .main{flex:1; display:flex; flex-direction:column; gap:16px}
    .section{padding:16px; border:1px solid var(--border); border-radius:10px; background:#fff}
    .section h2{font-size:18px; margin:0 0 12px 0}
    .section p{font-size:14px; color:#555; margin:0 0 12px 0}
    .section ul{padding-left:20px; margin:0 0 12px 0}
    .section ul li{font-size:14px; color:#555; margin-bottom:8px}
    form{display:grid; gap:12px}
    label{font-size:14px; color:#333}
    input[type="text"], input[type="email"], textarea{
      padding:10px; border:1px solid var(--border); border-radius:10px; font-size:14px; width:100%; box-shadow:inset 0 1px 2px rgba(0,0,0,.05)
    }
    button[type="submit"]{
      background:var(--line-green); color:#fff; border:none; padding:10px 16px; border-radius:10px; font-size:16px; cursor:pointer; font-weight:600
    }
    button[type="submit"]:hover{
      background:var(--line-green-d)
    }

    /* Footer */
    .footer{background:#f9f9f9; padding:16px 0; text-align:center; font-size:12px; color:#777}
  </style>
</head>
<body>
  <div class="wrap">
    <!-- HEADER: Site title and navigation -->
    <header class="header">
      <div class="container">
        <h1>JCBカードポータル</h1>
        <nav>
          <ul class="nav">
            <li><a href="#home">ホーム</a></li>
            <li><a href="#services">サービス</a></li>
            <li><a href="#contact">お問い合わせ</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <!-- MAIN CONTENT: Sections for home, services, contact -->
    <main class="main">
      <!-- HOME SECTION -->
      <section id="home" class="section">
        <h2>ようこそ、JCBカードポータルへ</h2>
        <p>JCBカードの最新情報やサービスをご確認いただけます。</p>
      </section>

      <!-- SERVICES SECTION -->
      <section id="services" class="section">
        <h2>サービス</h2>
        <ul>
          <li>オンライン決済</li>
          <li>ポイントプログラム</li>
          <li>カード管理</li>
        </ul>
      </section>

      <!-- CONTACT SECTION -->
      <section id="contact" class="section">
        <h2>お問い合わせ</h2>
        <form>
          <label for="name">お名前</label>
          <input type="text" id="name" name="name" required>
          <label for="email">メールアドレス</label>
          <input type="email" id="email" name="email" required>
          <label for="message">メッセージ</label>
          <textarea id="message" name="message" required></textarea>
          <button type="submit">送信</button>
        </form>
      </section>
    </main>

    <!-- FOOTER: Copyright notice -->
    <footer class="footer">
      <div class="container">
        <p>&copy; 2025 JCBカード. All rights reserved.</p>
      </div>
    </footer>
  </div>

  <script>
    // ------- State
    const S = {
      status:"idle", // idle, sending, line-notified, line-approved, line-rejected, fallback-calling, call-ringing, call-ongoing, call-approved, call-rejected, done
      otp: String(Math.floor(100000 + Math.random()*900000)),
      webPage: 'landing', // landing, login, mypage
      lineReachable: true
    };

    const els = {
      // left
      userName: document.getElementById('userName'),
      brandName: document.getElementById('brandName'),
      callReason: document.getElementById('callReason'),
      lineReachable: document.getElementById('lineReachable'),
      btnStart: document.getElementById('btnStart'),
      btnReset: document.getElementById('btnReset'),
      btnOpenWeb: document.getElementById('btnOpenWeb'),
      prog: document.getElementById('prog'),
      statusBadge: document.getElementById('statusBadge'),
      log: document.getElementById('log'),
      otpHint: document.getElementById('otpHint'),
      // tabs
      tabWeb: document.getElementById('tabWeb'),
      tabLine: document.getElementById('tabLine'),
      tabPhone: document.getElementById('tabPhone'),
      panelWeb: document.getElementById('panelWeb'),
      panelLine: document.getElementById('panelLine'),
      panelPhone: document.getElementById('panelPhone'),
      // LINE
      talkArea: document.getElementById('talkArea'),
      lineIdleMsg: document.getElementById('lineIdleMsg'),
      lineNotif: document.getElementById('lineNotif'),
      notifTitle: document.getElementById('notifTitle'),
      notifBody: document.getElementById('notifBody'),
      btnLineApprove: document.getElementById('btnLineApprove'),
      btnLineReject: document.getElementById('btnLineReject'),
      lineResultOk: document.getElementById('lineResultOk'),
      lineResultNg: document.getElementById('lineResultNg'),
      fallbackMsg: document.getElementById('fallbackMsg'),
      lineBrandTitle: document.getElementById('lineBrandTitle'),
      // PHONE
      callStageRinging: document.getElementById('callStageRinging'),
      callStageOngoing: document.getElementById('callStageOngoing'),
      btnCallAnswer: document.getElementById('btnCallAnswer'),
      btnCallReject: document.getElementById('btnCallReject'),
      btnCallApprove: document.getElementById('btnCallApprove'),
      btnCallReject2: document.getElementById('btnCallReject2'),
      callBrand: document.getElementById('callBrand'),
      callReason: document.getElementById('callReason'),
      callBrand2: document.getElementById('callBrand2'),
      callReason2: document.getElementById('callReason2'),
      callAvatar: document.getElementById('callAvatar'),
      // WEB panel container
      panelWeb: document.getElementById('panelWeb'),
    };

    function nowFmt(){return new Date().toLocaleTimeString('ja-JP', {hour12:false})}
    function log(msg){
      const p = document.createElement('div');
      p.textContent = `[${nowFmt()}] ${msg}`;
      els.log.prepend(p);
    }

    function setStatus(badge){
      els.statusBadge.textContent = badge;
    }

    function setProgress(v){ els.prog.value = v }

    function switchTab(name){
      const tabs = ['Web','Line','Phone'];
      tabs.forEach(t=>{
        const sel = (t===name);
        els['tab'+t].setAttribute('aria-selected', sel);
        els['panel'+t].hidden = !sel;
      })
    }

    function renderWeb(){
      const brand = els.brandName.value.trim();
      const user = els.userName.value.trim();
      if(S.webPage==='landing'){
        els.panelWeb.innerHTML = `
          <div class="statusbar"><span>9:41</span><span>brand.co.jp</span></div>
          <div class="card-h" style="border-bottom:1px solid var(--border)"><strong>${brand} ポータル</strong><span class="muted" style="font-size:12px">ゲスト</span></div>
          <div class="hero">
            <div style="font-size:22px; font-weight:800; margin-bottom:6px">ようこそ</div>
            <div class="muted" style="font-size:14px">安心・安全な本人確認で、カードの各種手続きがオンラインで行えます。</div>
            <div class="grid2" style="margin-top:16px">
              <div class="tile"><div style="font-weight:600">マイページ</div><div class="muted" style="font-size:12px">ご利用明細/ポイント</div></div>
              <div class="tile"><div style="font-weight:600">カード設定</div><div class="muted" style="font-size:12px">利用制限/海外利用</div></div>
            </div>
          </div>
          <div style="padding:16px; border-top:1px solid var(--border)">
            <button class="btn prim" id="webLoginBtn" style="width:100%">ログイン</button>
            <div class="muted" style="font-size:11px; text-align:center; margin-top:6px">ログインには LINE 認証（または電話）が必要です</div>
          </div>
        `;
        els.panelWeb.querySelector('#webLoginBtn').onclick = async ()=>{
          S.webPage='login'; renderWeb(); await beginAuth(true);
        };
      }
      if(S.webPage==='login'){
        els.panelWeb.innerHTML = `
          <div class="statusbar"><span>9:41</span><span>brand.co.jp</span></div>
          <div class="card-h"><strong>ログイン認証中</strong><span class="muted" style="font-size:12px">${brand}</span></div>
          <div class="card-c" style="height:calc(100% - 40px - 49px); display:grid; place-items:center">
            <div style="text-align:center">
              <div class="muted" style="margin-bottom:8px">LINE アプリ（または電話）で承認してください。</div>
              <div style="display:flex; gap:8px; justify-content:center">
                <button class="btn outl" id="toLine">LINEへ</button>
                <button class="btn outl" id="toPhone">電話へ</button>
              </div>
              <div class="muted" style="font-size:12px; margin-top:10px">承認完了後、自動的にマイページへ移動します。</div>
            </div>
          </div>`;
        els.panelWeb.querySelector('#toLine').onclick = ()=>{switchTab('Line')}
        els.panelWeb.querySelector('#toPhone').onclick = ()=>{switchTab('Phone')}
      }
      if(S.webPage==='mypage'){
        els.panelWeb.innerHTML = `
          <div class="statusbar"><span>9:41</span><span>brand.co.jp</span></div>
          <div class="card-h"><strong>マイページ</strong><span class="muted" style="font-size:12px">${user}</span></div>
          <div class="card-c" style="height:calc(100% - 40px - 49px); overflow:auto">
            <div class="tile" style="margin-bottom:8px"><div class="muted" style="font-size:12px">ログインユーザー</div><div style="font-size:18px; font-weight:700">${user}</div><div class="muted" style="font-size:12px">最終ログイン: ${new Date().toLocaleString('ja-JP')}</div></div>
            <div class="tile" style="margin-bottom:8px"><div style="font-weight:600">ポイント残高</div><div style="font-size:22px; font-weight:800; margin-top:4px">12,480 pt</div></div>
            <div class="tile"><div style="font-weight:600">最近のご利用</div><ul style="font-size:14px; margin:6px 0 0 0; padding:0 0 0 14px"><li>オンライン決済 2,980円（承認済み）</li><li>サブスク更新 1,200円（承認済み）</li><li>海外通販 5,480円（承認済み）</li></ul></div>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px">
              <button class="btn outl">ご利用明細</button>
              <button class="btn outl">カード設定</button>
            </div>
            <div style="margin-top:12px"><button class="btn" id="logoutBtn" style="width:100%">ログアウト</button></div>
          </div>`;
        els.panelWeb.querySelector('#logoutBtn').onclick = ()=>{S.webPage='landing'; renderWeb(); resetFlow()};
      }
    }

    function renderLine(){
      const brand = els.brandName.value.trim();
      const user = els.userName.value.trim();
      document.getElementById('lineBrandTitle').textContent = `${brand} 公式`;
      // thread
      const baseThread = [
        {who:'brand', time:'09:32', text:`${brand} 公式アカウントです。`},
        {who:'brand', time:'09:32', text:`アカウントへのログイン試行を検知しました。`},
        {who:'brand', time:'09:32', text:`ご本人による操作の場合は、下部の『認証する』を押してください。`},
        {who:'user',  time:'09:33', text:`自分のログインです。承認します。`},
      ];
      function bubbleHTML(who, text, time){
        const me = who==='user';
        return `<div class="flex ${me?'right':'left'}"><div class="bubble ${me?'me':''}">${text}<div class="bubble-time">${time}</div></div></div>`
      }
      els.talkArea.innerHTML = baseThread.map(m=>bubbleHTML(m.who,m.text,m.time)).join('') +
        (S.status==='line-rejected' ? bubbleHTML('brand','拒否を受け取りました。心当たりがない場合はサポートへご連絡ください。', nowFmt()): '') +
        (S.status==='done' ? bubbleHTML('brand','承認ありがとうございます。ログインを続行できます。', nowFmt()): '');

      els.lineIdleMsg.hidden = !(S.status==='idle');
      els.lineNotif.hidden = !(S.status==='line-notified' || S.status==='line-approved' || S.status==='line-rejected');
      els.lineResultOk.hidden = !(S.status==='line-approved' || S.status==='done');
      els.lineResultNg.hidden = !(S.status==='line-rejected');
      els.fallbackMsg.hidden = !(S.status==='fallback-calling' || S.status==='call-ringing' || S.status==='call-ongoing' || S.status==='call-approved' || S.status==='call-rejected' || S.status==='done');

      els.notifTitle.textContent = `${brand} からの認証リクエスト`;
      els.notifBody.textContent = `${user} 様のログインを確認します。OTP ${S.otp} の入力は不要です。`;

      document.getElementById('btnLineApprove').disabled = !(S.status==='line-notified');
      document.getElementById('btnLineReject').disabled = !(S.status==='line-notified');
    }

    function renderPhone(){
      const brand = els.brandName.value.trim();
      const reason = els.callReason.value.trim();
      els.callBrand.textContent = brand;
      els.callReason.textContent = reason;
      els.callBrand2.textContent = brand;
      els.callReason2.textContent = reason;
      els.callAvatar.textContent = brand.slice(0,1) || 'B';

      const ring = (S.status==='call-ringing' || S.status==='fallback-calling');
      const ongoing = (S.status==='call-ongoing' || S.status==='call-approved' || S.status==='call-rejected' || S.status==='done');
      els.callStageRinging.hidden = !ring;
      els.callStageOngoing.hidden = !ongoing;

      document.getElementById('callApproveMsg').style.display = (S.status==='call-approved')?'block':'none';
      document.getElementById('callRejectMsg').style.display = (S.status==='call-rejected')?'block':'none';

      els.btnCallApprove.disabled = !(S.status==='call-ongoing');
      els.btnCallReject2.disabled = !(S.status==='call-ongoing');
    }

    // -------- Flow helpers
    function resetFlow(){
      S.status = 'idle';
      setStatus('待機中');
      setProgress(0);
      S.otp = String(Math.floor(100000 + Math.random()*900000));
      els.otpHint.textContent = `OTP: ${S.otp}（UI 表示のみ／送信しません）`;
      renderAll();
    }

    async function beginAuth(fromWeb){
      S.status = 'sending'; setStatus('送信中'); setProgress(10); els.log.innerHTML=''; log('認証要求を送信しました（Web→サーバー→ユーザー端末）。');
      await new Promise(r=>setTimeout(r,600));
      const reachable = (els.lineReachable.value==='1');
      if(reachable){
        S.status = 'line-notified'; setStatus('LINE 通知済み'); setProgress(45); log('LINE アプリにプッシュ認証を送信しました。'); switchTab('Line');
      }else{
        log('LINE 通知に未達。ブランデッドコールへフォールバックします。');
        await new Promise(r=>setTimeout(r,500));
        S.status = 'fallback-calling'; setStatus('電話に切替中'); setProgress(55); switchTab('Phone');
        await new Promise(r=>setTimeout(r,700));
        S.status = 'call-ringing'; log('ブランデッドコールの発信を開始しました（着信中）。');
      }
      renderAll();
    }

    function doneAuth(){
      S.status='done'; setStatus('完了'); setProgress(100); log('認証が完了しました。');
      S.webPage='mypage'; renderWeb(); switchTab('Web');
    }

    // -------- Event wiring
    els.btnStart.onclick = ()=> beginAuth(false);
    els.btnReset.onclick = resetFlow;
    els.btnOpenWeb.onclick = ()=>{switchTab('Web'); S.webPage='landing'; renderWeb()};

    els.tabWeb.onclick = ()=>{switchTab('Web')};
    els.tabLine.onclick = ()=>{switchTab('Line')};
    els.tabPhone.onclick = ()=>{switchTab('Phone')};

    els.btnLineApprove.onclick = ()=>{ if(S.status==='line-notified'){ S.status='line-approved'; setStatus('LINE 承認'); setProgress(90); log('ユーザーが LINE で「認証」を押しました。'); setTimeout(doneAuth, 500); renderAll(); } };
    els.btnLineReject.onclick = ()=>{ if(S.status==='line-notified'){ S.status='line-rejected'; setStatus('LINE 拒否'); setProgress(100); log('ユーザーが LINE で「拒否」を押しました。'); renderAll(); } };

    els.btnCallAnswer.onclick = ()=>{ if(S.status==='call-ringing'){ S.status='call-ongoing'; setStatus('通話中'); setProgress(70); log('ユーザーが着信に応答しました（本人確認 IVR）。'); renderAll(); } };
    els.btnCallReject.onclick = ()=>{ if(S.status==='call-ringing'){ S.status='call-rejected'; setStatus('電話で拒否'); setProgress(100); log('ユーザーが電話で拒否しました。'); renderAll(); } };
    els.btnCallApprove.onclick = ()=>{ if(S.status==='call-ongoing'){ S.status='call-approved'; setStatus('電話で承認'); setProgress(95); log('ユーザーが電話で「承認」しました。'); setTimeout(doneAuth, 500); renderAll(); } };
    els.btnCallReject2.onclick = ()=>{ if(S.status==='call-ongoing'){ S.status='call-rejected'; setStatus('電話で拒否'); setProgress(100); log('ユーザーが電話で拒否しました。'); renderAll(); } };

    function renderAll(){ renderWeb(); renderLine(); renderPhone(); }

    // init
    resetFlow();
    switchTab('Web');
    renderAll();
  </script>
</body>
</html>
