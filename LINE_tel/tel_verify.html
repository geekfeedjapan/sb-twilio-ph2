<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LINE認証失敗時の電話認証デモ</title>
    <style>
        /* ==================================== */
        /* CSS: スマートフォンとLINE風インターフェース */
        /* ==================================== */
        body {
            font-family: 'Helvetica Neue', 'Arial', sans-serif;
            background-color: #f4f7f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px 0;
        }

        /* スマートフォン外枠のスタイル */
        .smartphone-frame {
            width: 100%;
            max-width: 375px; /* iPhone X/11/12の幅を想定 */
            height: 750px; /* スマートフォンの高さを想定 */
            background-color: #333;
            border: 10px solid #222;
            border-radius: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            position: relative;
            overflow: hidden;
        }

        /* 画面上部のノッチ/ステータスバーをシミュレート */
        .notch {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 150px;
            height: 30px;
            background-color: #222;
            border-radius: 0 0 15px 15px;
            z-index: 10;
        }
        
        .line-auth-container {
            display: flex;
            flex-direction: column;
            justify-content: center; /* 垂直方向の中央寄せ */
            align-items: center; /* 水平方向の中央寄せ */
            height: 100%;
            box-sizing: border-box;
        }

        .line-header-bar {
            background-color: #f7f7f7;
            border-bottom: 1px solid #e0e0e0;
            padding: 15px;
            position: absolute;
            top: 30px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 17px;
            font-weight: 600;
            color: #333;
            z-index: 5;
        }

        .content {
            text-align: center; /* コンテンツの中央寄せ */
            padding: 0 40px 20px 40px;
            flex-grow: 1;
            margin-top: 55px;
        }

        h3 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
            font-size: 18px;
            font-weight: 600;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-size: 14px;
            color: #666;
            margin-bottom: 5px;
        }

        .input-group input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
        }

        .btn-primary {
            width: 90%;
            margin: 0 auto;

            width: 100%;
            padding: 16px;
            background-color: #00b900;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-primary:hover {
            background-color: #00a000;
        }

        .error-message {
            color: #d8000c;
            background-color: #ffbaba;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            text-align: center;
            font-weight: 500;
            border: 1px solid #d8000c;
            margin-left: 4px; /* 左余白 */
            margin-right: 4px; /* 右余白 */
            white-space: pre-line; /* 改行を有効にする */
        }

        .success-message {
            color: #0f5132;
            background-color: #d1e7dd;
            padding: 12px;
            border-radius: 8px;
            margin-top: 16px;
            display: none;
            text-align: center;
            font-weight: 600;
            border: 1px solid #badbcc;
        }

        .alt-auth-option {
            text-align: center;
            margin-top: 30px;
            padding: 0 20px;
        }

        .alt-auth-option p {
            color: #555;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .btn-secondary-voice {
            width: 100%;
            padding: 15px;
            background-color: #f0f0f0;
            color: #007bff;
            border: 2px solid #007bff;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            font-weight: 600;
            transition: background-color 0.2s;
            display: none;
            margin-top: 10px;
        }

        .btn-secondary-voice:hover {
            background-color: #e0e0e0;
        }
        
        /* 音声通知のシミュレーション（着信画面風） */
        .voice-notification {
            background-color: #333;
            color: white;
            padding: 20px;
            border-radius: 15px;
            margin-top: 20px;
            display: none;
            text-align: center;
            transition: all 0.5s;
        }
        .voice-notification strong {
            color: #ffc107;
            display: block;
            margin-top: 5px;
        }
        .voice-notification .call-info {
            font-size: 28px;
            margin: 10px 0;
            font-weight: bold;
        }
        .voice-notification .info {
            font-size: 12px;
            color: #bbb;
        }
        .call-icon {
            font-size: 40px;
        }
    </style>
</head>
<body>

    <div class="smartphone-frame">
        <div class="notch"></div>
        <div class="line-auth-container">
            <div class="line-header-bar" id="step-title">LINEで認証</div>

            <div class="content">
                <div id="step-1">
    <h3>サービスにログイン</h3>
    <button class="btn-primary" onclick="tryLineAuth()">LINEでログイン</button>
</div>
                    
                </div>

                <div id="step-2" style="display: none;">
                    <div class="error-message" id="error-msg">
                        認証に失敗しました。
                        パスワードがロックされています。
                    </div>
                    
                    <div class="alt-auth-option">
                        <p><strong>パスワード再設定のため、ご登録の電話番号に認証コードをお送りします。</strong></p>
                        
                        <div class="voice-notification" id="voice-notify">
                            <span class="call-icon">📞</span>
                            <div class="call-info">
                                0800-XXX-XXXX
                            </div>
                            <span class="info">ソフトバンク Twilio Programmable Voice</span>
                            <strong>まもなく自動音声で認証コードが流れます。</strong>
                        </div>
                        
                        <button class="btn-secondary-voice" id="voice-auth-btn" onclick="triggerVoiceAuth()">
                            電話（音声通知）で認証コードを受け取る
                        </button>

                        <div class="input-group" style="margin-top: 30px;">
                            <label for="auth-code">電話で通知された認証コード</label>
                            <input type="text" id="auth-code" placeholder="6桁のコードを入力" maxlength="6" inputmode="numeric" />
                        </div>
                        <button class="btn-primary" id="verify-btn" onclick="verifyVoiceCode()" disabled>
                            認証を完了する
                        </button>

                        <div class="success-message" id="success-msg">認証に成功しました。ログインを完了しました。</div>
                        <div class="error-message" id="code-error">認証コードが正しくありません。もう一度お試しください。</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const step1 = document.getElementById('step-1');
        const step2 = document.getElementById('step-2');
        const errorMsg = document.getElementById('error-msg');
        const stepTitle = document.getElementById('step-title');
        const voiceNotify = document.getElementById('voice-notify');
        const voiceAuthBtn = document.getElementById('voice-auth-btn');
        const authCodeInput = document.getElementById('auth-code');
        const verifyButton = document.getElementById('verify-btn');
        const successMsg = document.getElementById('success-msg');
        const codeError = document.getElementById('code-error');
        
        const correctCode = '567890'; // デモ用認証コード

        function tryLineAuth() {
            // 認証失敗をシミュレート
            stepTitle.textContent = 'LINE認証失敗';
            step1.style.display = 'none';
            
            errorMsg.style.display = 'block';
            step2.style.display = 'block';
            voiceAuthBtn.style.display = 'block'; // 電話認証ボタンを表示
        }

        function triggerVoiceAuth() {
            // Twilio Programmable Voiceの発信をシミュレート
            voiceAuthBtn.disabled = true;
            voiceAuthBtn.textContent = '☎️ Twilioで発信処理を開始...';
            
            // 認証コード入力欄をリセット
            authCodeInput.value = '';
            authCodeInput.placeholder = '6桁のコードを入力';
            verifyButton.disabled = true;
            codeError.style.display = 'none';
            successMsg.style.display = 'none';

            // 着信画面風UIを表示
            voiceNotify.style.display = 'block';
            voiceNotify.style.backgroundColor = '#333';
            voiceNotify.querySelector('.call-icon').textContent = '📞';
            voiceNotify.querySelector('.call-info').textContent = '0800-XXX-XXXX';
            voiceNotify.querySelector('strong').textContent = 'まもなく自動音声で認証コードが流れます。';

            // 2秒後に音声通知が完了したことをシミュレート
            setTimeout(() => {
                voiceNotify.style.backgroundColor = '#28a745';
                voiceNotify.querySelector('.call-info').textContent = '✅ 音声通知完了';
                voiceNotify.querySelector('.call-icon').textContent = '🔊';
                voiceNotify.querySelector('strong').textContent = '「認証コード」を自動音声で読み上げました。入力してください。';
                voiceAuthBtn.textContent = '音声通知を再送する';
                voiceAuthBtn.disabled = false;
            }, 2000);
        }

        function verifyVoiceCode() {
            codeError.style.display = 'none';
            successMsg.style.display = 'none';

            const value = authCodeInput.value.trim();
            if (value.length !== 6) {
                codeError.textContent = '6桁の認証コードを入力してください。';
                codeError.style.display = 'block';
                return;
            }

            if (value === correctCode) {
                stepTitle.textContent = '認証完了';
                successMsg.style.display = 'block';
                voiceAuthBtn.disabled = true;
                verifyButton.disabled = true;
                authCodeInput.disabled = true;
            } else {
                codeError.textContent = '認証コードが正しくありません。もう一度お試しください。';
                codeError.style.display = 'block';
            }
        }

        // 入力長に応じてボタン活性化
        authCodeInput.addEventListener('input', () => {
            verifyButton.disabled = authCodeInput.value.trim().length !== 6;
            codeError.style.display = 'none';
            successMsg.style.display = 'none';
        });
    </script>
</body>
</html>
