<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Twilio LINE Verify 統合デモ（フル機能プレビュー）</title>
  <style>
    /* =========================================================
       Global / Background: Hotel-like landing page behind demo
       ========================================================= */
    :root{
      --line-green: #00b900;
      --hotel-accent: #8d6e63;
      --hotel-bg1: #f5efe6;
      --hotel-bg2: #e8dfd2;
      --verify-accent: #ff9800;
      --ink: #333;
    }
    html, body {
      height: 100%;
    }
    body {
      margin: 0;
      font-family: "Helvetica Neue", Arial, sans-serif;
      color: var(--ink);
      /* Soft hotel background with gradient */
      background: radial-gradient(1200px 800px at 20% 10%, var(--hotel-bg1), transparent 60%),
                  radial-gradient(1000px 700px at 80% 0%, var(--hotel-bg2), transparent 60%),
                  linear-gradient(180deg, #faf7f2, #eee7dc 65%, #f8f5f0);
      display: grid;
      grid-template-rows: auto 1fr;
      min-height: 100vh;
    }

    /* Faux hotel header */
    .hotel-header {
      display: flex;
      align-items: center;
      gap: 24px;
      padding: 14px 24px;
      background: rgba(255,255,255,0.7);
      backdrop-filter: blur(6px);
      border-bottom: 1px solid #e6dccf;
    }
    .logo {
      width: 36px; height: 36px;
      border-radius: 8px;
      background: conic-gradient(from 20deg, #c1976b, #b08968, #f1e0c6, #b08968);
      box-shadow: 0 2px 8px rgba(0,0,0,.08) inset;
    }
    .brand {
      font-weight: 700;
      letter-spacing: .02em;
    }
    .nav {
      margin-left: auto;
      display: flex;
      gap: 18px;
      color: #6c5f57;
      font-size: 14px;
    }

    /* Landing hero strip (faux hotel site) */
    .hero {
      display: grid;
      grid-template-columns: 1.1fr 1fr;
      gap: 24px;
      align-items: center;
      padding: 24px 24px 0;
    }
    .hero-copy h1 {
      margin: 0 0 8px;
      font-weight: 800;
      letter-spacing: .01em;
    }
    .hero-copy p {
      margin: 0;
      color: #6c5f57;
    }
    .hero-card {
      justify-self: end;
    }

    /* =========================================================
       Device (smartphone) frame
       ========================================================= */
    .device {
      width: 390px;
      height: 780px;
      background: #111;
      border-radius: 42px;
      padding: 14px;
      box-shadow:
        0 24px 60px rgba(0,0,0,.35),
        0 4px 16px rgba(0,0,0,.25);
      position: relative;
    }
    .device::before {
      /* Notch */
      content:"";
      position:absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: 160px;
      height: 26px;
      background: #000;
      border-radius: 14px;
    }
    .device-inset {
      width: 100%;
      height: 100%;
      background: #f2f2f2;
      border-radius: 28px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border: 1px solid rgba(0,0,0,.08);
    }

    /* =========================================================
       Top bar (app title + controls)
       ========================================================= */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      background: var(--line-green);
      color: white;
      font-weight: 700;
      font-size: 16px;
    }
    .controls {
      display:flex;
      align-items: center;
      gap: 8px;
    }
    .select, .btn {
      font: inherit;
      border-radius: 999px;
      border: none;
      padding: 6px 10px;
      cursor: pointer;
    }
    .select {
      color: #1b5e20;
      background: #d5f5d2;
      font-weight: 700;
    }
    .btn {
      background: rgba(255,255,255,.2);
      color: #fff;
      font-weight: 800;
    }
    .btn-outline {
      background: transparent;
      border: 2px solid rgba(255,255,255,.85);
      color: #fff;
    }

    /* =========================================================
       Chat area
       ========================================================= */
    .chat {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .chat-body {
      flex: 1;
      overflow-y: auto;
      background: #e8e8e8;
      padding: 10px;
    }
    .chat-inputbar {
      display: flex;
      gap: 8px;
      padding: 8px;
      background: #f7f7f7;
      border-top: 1px solid #ddd;
    }
    .chat-inputbar input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid #ccc;
      border-radius: 18px;
      font-size: 14px;
    }
    .chat-inputbar button {
      width: 44px; height: 44px;
      border-radius: 50%;
      border: none;
      background: var(--line-green);
      color: #fff;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
    }

    /* Bubbles */
    .row { display:flex; margin: 8px 0; }
    .row.user { justify-content: flex-end; }
    .row.bot { justify-content: flex-start; }
    .row.system { justify-content: center; }
    .bubble {
      max-width: 76%;
      padding: 10px 14px;
      border-radius: 18px;
      line-height: 1.4;
      font-size: 15px;
      box-shadow: 0 1px 0 rgba(0,0,0,.06);
      word-break: break-word;
    }
    .row.bot .bubble {
      background: #fff;
      border-bottom-left-radius: 6px;
    }
    .row.user .bubble {
      background: #9fe670;
      border-bottom-right-radius: 6px;
    }
    .row.system .bubble {
      background: #f7e09f;
      color: #835200;
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 6px;
    }

    /* Verify UI card */
    .verify-card {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 14px;
      text-align: center;
      margin-top: 6px;
    }
    .verify-card p { margin: 8px 0; color: #555; font-size: 14px; }
    .verify-card input {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 12px;
      margin: 6px 0 10px;
      font-size: 18px;
      letter-spacing: 6px;
      border-radius: 8px;
      border: 1px solid #ccc;
      text-align: center;
    }
    .verify-actions {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .verify-btn {
      background: var(--verify-accent);
      color: #fff;
      border: none;
      padding: 8px 12px;
      border-radius: 8px;
      font-weight: 800;
      cursor: pointer;
    }
    .verify-secondary {
      background: #eee3d1;
      color: #6b4f37;
      border: none;
      padding: 8px 12px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
    }

    /* Integration help footer inside device */
    .footer-help {
      font-size: 11px;
      color: #6c5f57;
      background: #fcfaf6;
      border-top: 1px dashed #e6dccf;
      padding: 6px 10px;
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: center;
    }
    .code-chip {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 11px;
      background: #efe7da;
      border: 1px solid #e1d7c7;
      padding: 2px 6px;
      border-radius: 999px;
    }

    /* Utility */
    .muted { color: #666; font-size: 12px; }
    .hidden { display: none !important; }

    @media (max-width: 1000px) {
      .hero { grid-template-columns: 1fr; }
      .hero-card { justify-self: start; }
    }
  </style>
</head>
<body>
  <!-- Faux hotel site header -->
  <header class="hotel-header">
    <div class="logo" aria-hidden="true"></div>
    <div class="brand">SkyStay Hotel</div>
    <nav class="nav">
      <span>客室</span>
      <span>レストラン</span>
      <span>スパ</span>
      <span>アクセス</span>
    </nav>
  </header>

  <section class="hero">
    <div class="hero-copy">
      <h1>ご予約サポートAI（LINE風UI）</h1>
      <p>Twilio Verify を使った二段階認証のフローを、スマホUIで実演します。<br/>
         実機に近い見た目・操作感で商談・説明に活用できます。</p>
    </div>
    <div class="hero-card">
      <!-- Device frame with the app -->
      <div class="device">
        <div class="device-inset">
          <div class="topbar">
            <div>ホテル予約AIアシスタント</div>
            <div class="controls">
              <select id="channel" class="select" title="Verifyチャネル">
                <option value="sms" selected>SMS</option>
                <option value="whatsapp">WhatsApp</option>
              </select>
              <button id="resetBtn" class="btn btn-outline" title="デモを最初から">Reset</button>
            </div>
          </div>

          <div id="chat" class="chat">
            <div id="chat-body" class="chat-body"></div>
            <div class="chat-inputbar">
              <input type="text" id="chat-input" placeholder="メッセージを入力..." disabled />
              <button id="send-btn" title="送信" disabled>▶</button>
            </div>
          </div>

          <div class="footer-help">
            <div class="muted">デモ用 固定成功コード: <span class="code-chip">123456</span></div>
            <div class="muted">置換ポイント: <span class="code-chip">Service SID / To</span></div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <script>
    // ======================= Demo Config =======================
    const chatBody = document.getElementById('chat-body');
    const chatInput = document.getElementById('chat-input');
    const sendBtn = document.getElementById('send-btn');
    const resetBtn = document.getElementById('resetBtn');
    const channelSelect = document.getElementById('channel');

    let currentStep = 0;
    let isVerifyStep = false;
    const verifySuccessCode = '123456'; // デモ成功コード（表示にも明示）

    // ======================= Helpers =======================
    function el(tag, opts={}){
      const n = document.createElement(tag);
      if(opts.className) n.className = opts.className;
      if(opts.text) n.textContent = opts.text;
      if(opts.html) n.innerHTML = opts.html;
      return n;
    }

    function displayMessage(text, sender, {isHtml=false} = {}) {
      const row = el('div', { className: `row ${sender}` });
      const bubble = el('div', { className: 'bubble' });
      if (isHtml) bubble.innerHTML = text;
      else bubble.textContent = text;
      row.appendChild(bubble);
      chatBody.appendChild(row);
      chatBody.scrollTop = chatBody.scrollHeight;
      return bubble;
    }

    function systemMsg(text){ return displayMessage(text, 'system'); }
    function botMsg(text, isHtml=false){ return displayMessage(text, 'bot', {isHtml}); }
    function userMsg(text){ return displayMessage(text, 'user'); }

    function createVerifyHtml(){
      return `
        <div class="verify-card" id="verify-card">
          <p>📱 <strong>6桁の認証コード</strong>を入力してください。</p>
          <p class="muted">
            チャネル: <strong>${channelSelect.value.toUpperCase()}</strong> |
            送信先: ***-****-1234（デモ）
          </p>
          <input type="text" id="verify-code" placeholder="XXXXXX" maxlength="6" inputmode="numeric" />
          <div class="verify-actions">
            <button class="verify-btn" id="verify-submit">検証</button>
            <button class="verify-secondary" id="verify-resend">コード再送</button>
          </div>
        </div>
      `;
    }

    function focusVerifyInputSoon(){
      setTimeout(() => {
        const vc = document.getElementById('verify-code');
        if(vc) vc.focus();
      }, 120);
    }

    // ======================= Demo Script =======================
    const demoSteps = [
      { sender: 'bot', text: 'こんにちは。ご予約ありがとうございます。ご用件をお知らせください。', nextText: 'チェックイン時間を変更したい。' },
      { sender: 'user', text: 'チェックイン時間を14時から15時に変更したい。' },
      { sender: 'bot', text: '承知いたしました。予約内容に重要な変更があるため、二段階認証を実施します。' },
      // channel-dependent system message
      { sender: 'system', dynamic: true },
      { sender: 'bot', html: true, verifyTrigger: true },
    ];

    function channelSystemMessage(){
      const ch = channelSelect.value;
      if(ch === 'sms'){
        return '🔒 <strong>Twilio Verify API</strong> が電話番号(***-****-1234)へ <strong>SMS</strong> 認証コードを送信しました。';
      } else {
        return '🔒 <strong>Twilio Verify API</strong> が WhatsApp 宛に認証コードを送信しました。（受信先: ***-****-1234 連携アカウント）';
      }
    }

    function initChat(){
      chatBody.innerHTML = '';
      chatInput.value = '';
      chatInput.disabled = false;
      sendBtn.disabled = false;
      currentStep = 0;
      isVerifyStep = false;

      // Kick off first bot message
      botMsg(demoSteps[0].text);
      chatInput.placeholder = '「チェックイン時間を変更したい。」など入力不要（▶で進む）';
    }

    function next(){
      if(isVerifyStep) return;

      // simulate user reply for steps that have nextText
      const step = demoSteps[currentStep];
      if(step && step.nextText){
        userMsg(step.nextText);
        currentStep++;
      }

      // display subsequent step
      if(currentStep < demoSteps.length){
        const nextStep = demoSteps[currentStep];
        if(nextStep.dynamic){
          systemMsg(channelSystemMessage());
          currentStep++;
        } else if(nextStep.html){
          botMsg(createVerifyHtml(), true);
          isVerifyStep = true;
          chatInput.disabled = true;
          sendBtn.disabled = true;
          currentStep++;
          // Wire up verify form handlers
          setTimeout(() => {
            const submit = document.getElementById('verify-submit');
            const resend = document.getElementById('verify-resend');
            submit?.addEventListener('click', verifyCode);
            resend?.addEventListener('click', resendCode);
            focusVerifyInputSoon();
          }, 30);
        } else {
          // Normal text step
          const txt = nextStep.text;
          if(nextStep.sender === 'bot') botMsg(txt);
          else if(nextStep.sender === 'system') systemMsg(txt);
          else userMsg(txt);
          currentStep++;
        }
      }
    }

    // ======================= Verify Simulation =======================
    function resendCode(){
      const bubble = systemMsg('⏳ 認証コードを再送しています…');
      setTimeout(() => {
        bubble.textContent = channelSelect.value === 'sms'
          ? '✅ SMSで認証コードを再送しました。'
          : '✅ WhatsAppで認証コードを再送しました。';
        focusVerifyInputSoon();
      }, 900);
    }

    function verifyCode(){
      const input = document.getElementById('verify-code');
      const card = document.getElementById('verify-card');
      if(!input || !card) return;

      const code = input.value.trim();
      if(code.length !== 6 || !/^\d{6}$/.test(code)){
        alert('認証コードは6桁の数字です。');
        return;
      }

      // Pretend calling Twilio Verify check API
      const submit = document.getElementById('verify-submit');
      submit.disabled = true;
      submit.textContent = 'Twilio Verifyで検証中…';

      setTimeout(() => {
        const ok = (code === verifySuccessCode);
        if(ok){
          systemMsg('✅ Twilio Verify による本人認証に成功しました！');
          botMsg('チェックイン時刻を 15:00 に変更しました。変更完了です。');
          isVerifyStep = false;
          chatInput.disabled = false;
          sendBtn.disabled = false;
          chatInput.placeholder = 'メッセージを入力...';
          card.classList.add('hidden');
        } else {
          systemMsg(`❌ 認証コード [${code}] が一致しません。もう一度ご確認ください。`);
          submit.disabled = false;
          submit.textContent = '検証';
          // inline hint
          const hint = card.querySelector('p');
          if(hint){
            hint.innerHTML = `📱 <strong>6桁の認証コード</strong>を入力してください。<br>
              <strong style="color:#c62828;">コードが異なります。再入力してください。</strong>`;
          }
          input.focus();
          input.select();
        }
      }, 1100);
    }

    // ======================= Real Integration Notes =======================
    // 実運用時は以下のような形で server-side にリクエストします（例：fetchで自サーバーを叩く）:
    //
    // 1) 認証コード送信（Start Verify）
    //   POST /api/verify/start  BODY: { channel: "sms" | "whatsapp", to: "+81XXXXXXXXXX" }
    //   => server：Twilio Verify v2 API (Verification/Verifications) を呼び出す
    //
    // 2) コード検証（Check Verify）
    //   POST /api/verify/check  BODY: { to: "+81XXXXXXXXXX", code: "123456" }
    //   => server：Twilio Verify v2 API (VerificationCheck) を呼び出す
    //
    // ※ ブラウザから直接Twilioを呼ばず、必ず認証情報はサーバー側で保持してください。

    // ======================= Wire Events =======================
    sendBtn.addEventListener('click', next);
    chatInput.addEventListener('keypress', (e) => { if(e.key === 'Enter') next(); });
    resetBtn.addEventListener('click', initChat);
    channelSelect.addEventListener('change', () => {
      // if verify card is visible, refresh the card to reflect channel label
      const card = document.getElementById('verify-card');
      if(card){
        // replace with a fresh card
        const row = card.closest('.row');
        if(row){
          row.querySelector('.bubble').innerHTML = createVerifyHtml();
          // rebind
          setTimeout(() => {
            document.getElementById('verify-submit')?.addEventListener('click', verifyCode);
            document.getElementById('verify-resend')?.addEventListener('click', resendCode);
            focusVerifyInputSoon();
          }, 30);
        }
      }
    });

    // Start
    initChat();
  </script>
</body>
</html>
