<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ソフトバンクエアライン｜多段階通知デモ（QR入口・事前通知登録）</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600;700&display=swap" rel="stylesheet" />
<style>
  :root{ --brand:#0B74D1; }
  *{ box-sizing:border-box }
  body{ margin:0; font-family:"Noto Sans JP", system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; background:#f5f8fc; color:#1a1a1a }
  a{ color:var(--brand); text-decoration:none }
  header{ background:#fff; border-bottom:1px solid #e6eef7; position:sticky; top:0; z-index:10 }
  .wrap{ max-width:1120px; margin:0 auto; padding:0 16px }
  .nav{ height:60px; display:flex; align-items:center; justify-content:space-between }
  .logo{ display:flex; align-items:center; gap:10px; font-weight:700; font-size:18px }
  .logo-badge{ display:inline-grid; place-items:center; width:28px; height:28px; border-radius:6px; background:var(--brand); color:#fff; font-weight:700 }
  .hero{ background:linear-gradient(140deg,#e9f3ff 0%,#ffffff 40%); padding:32px 0 24px; border-bottom:1px solid #e6eef7 }
  .card{ background:#fff; border:1px solid #e3ebf5; border-radius:14px; padding:20px }
  .cards{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:12px }
  .btn{ display:inline-flex; align-items:center; gap:8px; background:var(--brand); color:#fff; border:none; border-radius:10px; padding:10px 14px; font-weight:600; cursor:pointer }
  .btn.secondary{ background:#eef5ff; color:#124a88 }
  .section{ padding:28px 0 }
  .split{ display:grid; grid-template-columns:1fr 1fr; gap:20px }
