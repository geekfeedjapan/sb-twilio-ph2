<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>事前通知登録 - ソフトバンクエアライン</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to bottom, #f0f8ff, #ffffff);
      margin: 0;
      padding: 0;
    }
    .header {
      background-color: #1e90ff;
      color: white;
      padding: 20px;
      text-align: center;
    }
    .container {
      max-width: 600px;
      margin: 30px auto;
      padding: 20px;
      background: white;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }
    .qr-section {
      text-align: center;
    }
    .qr-section img {
      margin: 20px 0;
    }
    .qr-section p {
      font-size: 14px;
      color: #555;
    }
    .footer {
      text-align: center;
      padding: 10px;
      font-size: 12px;
      color: #888;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>ソフトバンクエアライン</h1>
    <p>事前通知登録</p>
  </div>
  <div class="container">
    <div class="qr-section">
      <h2>QRコードをスキャンして登録</h2>
      <img src="https://via.placeholder.com/200" alt="QRコード">
      <p>スマートフォンでQRコードをスキャンして、事前通知の登録を行ってください。</p>
    </div>
  </div>
  <div class="footer">
    &copy; 2025 ソフトバンクエアライン. All rights reserved.
  </div>
</body>
</html>
