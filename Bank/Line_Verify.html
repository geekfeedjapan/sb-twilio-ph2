<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LINE認証と電話認証</title>
    <style>
        body {
            font-family: 'Helvetica Neue', 'Arial', sans-serif;
            background-color: #f4f7f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .auth-container {
            width: 100%;
            max-width: 400px;
            background-color: white;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
            overflow: hidden;
            padding: 20px;
        }

        .line-logo {
            text-align: center;
            margin-bottom: 30px;
        }
        .line-logo img {
            width: 80px;
            height: 80px;
            border-radius: 20px;
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
            font-size: 20px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            font-size: 14px;
            color: #666;
            margin-bottom: 5px;
        }

        .input-group input {
            width: calc(100% - 20px);
            padding: 12px 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
        }

        .btn-primary {
            width: 100%;
            padding: 15px;
            background-color: #00b900; /* LINEの緑 */
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-primary:hover {
            background-color: #00a000;
        }

        .error-message {
            color: #ff0000;
            background-color: #ffebeb;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
            text-align: center;
            font-weight: 500;
        }

        .voice-notification {
            background-color: #333;
            color: white;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
            text-align: center;
        }
        .voice-notification strong {
            color: #ffc107;
            display: block;
            margin-top: 5px;
        }
        .voice-notification .call-info {
            font-size: 24px;
            margin: 10px 0;
            font-weight: bold;
        }
        .voice-notification .info {
            font-size: 12px;
            color: #bbb;
        }
    </style>
</head>
<body>

        <div class="line-logo">
            <img src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA1MTIgNTEyIj48ZGVmcz48c3R5bGU+LmNscy0xLHtmaWxsOiMxZWM2NWJ9PC9zdHlsZT48L2RlZnM+PHRpdGxlPmxpbmUtbG9nby13aGl0ZS1uZXc8L3RpdGxlPjxnIGlkPSJMYXllcl8yIiBkYXRhLW5hbWU9IkxheWVyIDIiPjxnIGlkPSJMYXllcl8xLTIiIGRhdGEtbmFtZT0iTGF5ZXIgMSI+PHJlY3QgY2xhc3M9ImNscy0xIiB4PSIyIiB5PSIyIiB3aWR0aD0iNTA4IiBoZWlnaHQ9IjUwOCIgc3R5bGU9ImZpbGw6I3MyMTIxMjEiIHJ4PSI3MS44NyIvPjxwYXRoIHN0eWxlPSJmaWxsOiNmZmYiIGQ9Ik00MDAuMzYsMTUzLjM2QzM2NC4xOSwxMTcuMTksMzE2LjkzLDk3Ljk0LDI1Niw5Ny45NGMtNjAuOTQsMC0xMDguMjEsMTkuMjUtMTQ0LjM3LDU1LjQyLTM2LjE5LDM2LjE5LTU1LjQyLDgzLjQ2LTU1LjQyLDE0NC4zN3MwLS4wMSwwLDExLjdWMzU1bDM3LjUtLjEyYzUuNjYtMS42NCwxMi41LTYuNDksMTcuNjItMTIuMDcsMTIuODktMTMuNDEsMTUuMTMtMTguMiwxNS4xMy0yNC42MiwwLTUuMTktLjE2LTEwLjUyLTMuODEtMTQuNDEtMy42Mi0zLjczLTEzLjA1LTQuNzctMjQtMy4xMVMyMDcuNzQsMzI4LDIwNS4wNiwzMjguNTNjMi43OCwyLjg0LDMuODEsNC4xMSwzLjI5LDEwLjA3LS43LDEzLjczLTE1LjE5LDE2LjQ5LTIyLjcyLDE1LjE5bC0xNi41NS0yLjQxLTIuNjIsMTYuNDhMNjIuMzcsNDEzVjIzN2MwLTUxLjgyLDQ1LjQ0LTEwMC4xOSwxMDIuMi0xMDMuMTgsNTMuOTEtMi44OCwxMDYuMDgsMTQuMiwxNDMuMjcsNTQuNjVsMTYuODksMTcuNTFsMTcuMjgtMTkuMzFjMzYuNzgtNDEuMzYsODguNDQtNTcuNzQsMTQzLjExLTQ5LDEwMS4zNSwxNi4zNywxNjguNjEsMTExLjIyLDE1Mi4yMywyMTIuNTgtMTIuNDMsNzYuNDctNTkuNTIsMTM2LjA2LTEzMC42NCwxNTkuMjMtMy45Mi40Mi01LjU1LjQ0LTMuNzYtMS4xMSs3LjIyLTcuNjIsNy41Ny03LjY3LDguNzgtMTIuNTFsNC4zNC0xNi45Ni0yLjMtMi4zNWMtMi41MS0yLjY3LTQuNDctMy45Mi02Ljc3LTQuMzUtMTAuNjctMi01MC44NC04LjQ3LTU4LjI3LThTNDMzLjE4LDQxMi40Myw0MzcuNDcsNDE0LjQ1VjI3Ni40MWwxNC4xOS0xNS41OUM0NjguNjksMjMwLjI3LDQ2NC4zMSwxODEuNzgsNDI5LjU2LDE1MC4yMWwtNS4zMi00LjY2LTEuMTEuNDN6Ii8+PC9nLz48L2c+PC9zdmc+" alt="LINE Icon">
        </div>

        <h2 id="step-title">📱 LINE認証サービス</h2>

        <div id="step-1">
            <div class="input-group">
                <label for="id">LINE ID (メールアドレス)</label>
                <input type="text" id="id" value="user@example.com" readonly>
            </div>
            <div class="input-group">
                <label for="password">パスワード</label>
                <input type="password" id="password" value="incorrect_password" readonly>
            </div>
            <button class="btn-primary" onclick="tryLineAuth()">認証を試みる</button>
        </div>

        <div id="step-2" style="display: none;">
            <div class="error-message" id="error-msg">
                認証に失敗しました。パスワードがロックされています。
            </div>
            
            <div class="alt-auth-option">
                <p>パスワード再設定のため、ご登録の電話番号に認証コードをお送りします。</p>
                <button class="btn-primary" onclick="triggerVoiceAuth()">
                    電話（Twilio Programmable Voice）で認証コードを受け取る
                </button>
                <span style="display: block; margin-top: 10px; font-size: 12px; color: #999;">
                    ※ご登録電話番号：***-****-1234
                </span>
            </div>
        </div>

        <div id="step-3" style="display: none;">
            <div class="voice-notification">
                <span class="info">着信をシミュレーション中...</span>
                <div class="call-info">
                    📞 0800-XXX-XXXX
                </div>
                <strong>KDDIグループ Twilio Programmable Voice</strong>
                <span class="info">まもなく自動音声で認証コードが流れます。</span>
            </div>
            
            <div class="input-group" style="margin-top: 25px;">
                <label for="auth-code">電話で通知された認証コード</label>
                <input type="text" id="auth-code" placeholder="6桁のコードを入力">
            </div>
            <button class="btn-primary" onclick="verifyVoiceCode()">
                認証コードを検証
            </button>
        </div>
        
    </div>

    <script>
        const step1 = document.getElementById('step-1');
        const step2 = document.getElementById('step-2');
        const step3 = document.getElementById('step-3');
        const errorMsg = document.getElementById('error-msg');
        const stepTitle = document.getElementById('step-title');
        const voiceNotification = document.querySelector('.voice-notification');
        
        const correctCode = '567890'; // デモ用認証コード

        function tryLineAuth() {
            // 認証失敗をシミュレート
            step1.style.display = 'none';
            stepTitle.textContent = '🔒 LINE認証失敗';
            
            errorMsg.style.display = 'block';
            step2.style.display = 'block';
        }

        function triggerVoiceAuth() {
            // Twilio Programmable Voiceの発信をシミュレート
            step2.style.display = 'none';
            stepTitle.textContent = '☎️ 電話認証へ切り替え';
            
            step3.style.display = 'block';
            voiceNotification.style.display = 'block';
            
            // 2秒後に音声通知が完了したことをシミュレート
            setTimeout(() => {
                voiceNotification.style.backgroundColor = '#28a745';
                voiceNotification.querySelector('.call-info').textContent = '✅ 音声通知完了 (コード: ' + correctCode + ')';
                voiceNotification.querySelector('strong').textContent = '認証コードが電話で通知されました。';
            }, 2000);
        }

        function verifyVoiceCode() {
            const enteredCode = document.getElementById('auth-code').value.trim();
            const primaryBtn = document.querySelector('#step-3 .btn-primary');

            if (enteredCode === correctCode) {
                // 認証成功
                primaryBtn.style.backgroundColor = '#28a745';
                primaryBtn.textContent = '✅ 認証成功！LINEサービスにログインします';
                alert('認証成功！Twilio Programmable Voiceによる代替認証が完了しました。');
            } else {
                // 認証失敗
                primaryBtn.style.backgroundColor = '#dc3545';
                primaryBtn.textContent = '❌ コードが異なります。再試行してください';
            }
        }

        window.onload = function() {
            // デモ開始
            initDemo();
        };

        function initDemo() {
            step1.style.display = 'block';
            step2.style.display = 'none';
            step3.style.display = 'none';
            errorMsg.style.display = 'none';
            voiceNotification.style.display = 'none';
            stepTitle.textContent = '📱 LINE認証サービス';
        }
    </script>
</body>
</html>
